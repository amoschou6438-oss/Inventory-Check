<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1f2430;
    --text-muted: #6b7280;
    --border: #e2e5eb;
    --accent: #2f6f4f;
    --accent-light: #e8f3ec;
    --zero-bg: #fff4e5;
    --zero-border: #f0c789;
    --header-bg: #2f6f4f;
    --header-text: #ffffff;
    --hover: #f0f7f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --card-bg: #1d2025;
      --text: #e8e9ec;
      --text-muted: #9aa0aa;
      --border: #2c3038;
      --accent: #4caf7d;
      --accent-light: #223229;
      --zero-bg: #332a17;
      --zero-border: #6b5423;
      --header-bg: #22492f;
      --header-text: #f1f5f2;
      --hover: #202823;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --card-bg: #1d2025;
    --text: #e8e9ec;
    --text-muted: #9aa0aa;
    --border: #2c3038;
    --accent: #4caf7d;
    --accent-light: #223229;
    --zero-bg: #332a17;
    --zero-border: #6b5423;
    --header-bg: #22492f;
    --header-text: #f1f5f2;
    --hover: #202823;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 20px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px 0;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 16px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
  }
  .search-box {
    flex: 1;
    min-width: 180px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 16px;
  }
  button {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    min-height: 40px;
    transition: background 0.15s, border-color 0.15s;
  }
  @media (max-width: 640px) {
    body { padding: 10px 8px 32px; }
    h1 { font-size: 1.1rem; }
    .subtitle { font-size: 0.75rem; margin-bottom: 12px; }
    .toolbar { gap: 8px; }
    .search-box { flex-basis: 100%; }
    #exportBtn { flex: 1; min-width: 0; font-size: 0.8rem; padding: 9px 10px; }
    .tabs { gap: 6px; }
    .tab-btn { padding: 8px 6px; font-size: 0.78rem; flex: 1 1 0; text-align: center; }
    .subtabs { gap: 4px; }
    .subtab-btn { padding: 6px 10px; font-size: 0.74rem; }
    table { font-size: 0.85rem; }
    thead th:nth-child(2), tbody td:nth-child(2) { width: 72px; }
    thead th:nth-child(3), tbody td:nth-child(3) { width: 32px; }
    thead th { padding: 8px 6px; }
    tbody td { padding: 8px 6px; }
    .name-cell { gap: 4px; }
    .hint-icon { width: 19px; height: 19px; font-size: 0.68rem; }
    .del-btn { font-size: 1rem; padding: 4px 6px; }
  }
  @media (max-width: 380px) {
    thead th:nth-child(2), tbody td:nth-child(2) { width: 62px; }
    table { font-size: 0.8rem; }
  }
  button:hover { background: var(--hover); }
  button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  button.primary:hover { opacity: 0.9; }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: nowrap;
  }
  .tab-btn {
    flex: 1 1 0;
    padding: 8px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.9rem;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .subtabs {
    display: flex;
    gap: 5px;
    margin: -6px 0 12px 0;
    flex-wrap: wrap;
  }
  .subtab-btn {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.8rem;
  }
  .subtab-btn.active {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }
  .float-home-btn {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 50;
    width: 56px;
    height: 56px;
    min-height: 56px;
    border-radius: 50%;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1c2340;
    border: 3px solid #d4af5a;
    color: #ffffff;
    font-size: 1.6rem;
    line-height: 1;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
  }
  .float-home-btn:hover { background: #232b4d; }
  .float-home-btn:active { transform: scale(0.94); }
  @media (max-width: 640px) {
    .float-home-btn { right: 14px; bottom: 14px; width: 52px; height: 52px; min-height: 52px; font-size: 1.45rem; }
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .table-wrap {
    overflow-x: auto;
    max-width: 100%;
    -webkit-overflow-scrolling: touch;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
    font-size: 0.88rem;
  }

// 取得子分頁顯示用名稱：優先使用分析出的中文名稱，找不到時退回原字母
function getSubgroupLabel(groupKey, subKey) {
  const map = SUBGROUP_LABELS[groupKey];
  return (map && map[subKey]) ? map[subKey] : subKey;
}

// 取得某個品項的子分頁鍵值（貨品編號第 2 碼）
function getSubgroupKey(code) {
  if (!code || code.length < 2) return '其他';
  const ch = code[1];
  return /[A-Za-z]/.test(ch) ? ch.toUpperCase() : '其他';
}

// 依子分頁鍵值，把某分類的所有品項分組
function getSubgroupsFor(key) {
  const rows = DATA[key] || [];
  const map = {};
  rows.forEach(r => {
    const sk = getSubgroupKey(r.code);
    if (!map[sk]) map[sk] = [];
    map[sk].push(r);
  });
  return map;
}

// ---- 內建 XLSX 產生器（不依賴外部 CDN，離線也能使用）----
function crc32(buf) {
  const table = crc32.table || (crc32.table = (() => {
    const t = [];
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c;
    }
    return t;
  })());
  let crc = 0 ^ (-1);
  for (let i = 0; i < buf.length; i++) crc = (crc >>> 8) ^ table[(crc ^ buf[i]) & 0xFF];
  return (crc ^ (-1)) >>> 0;
}

function makeZip(files) {
  const localParts = [], centralParts = [];
  let offset = 0;
  files.forEach(f => {
    const nameBytes = f.nameBytes, data = f.data, crc = crc32(data);
    const localHeader = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(localHeader.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true); dv.setUint16(28, 0, true);
    localHeader.set(nameBytes, 30);
    localParts.push(localHeader, data);

    const centralHeader = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(centralHeader.buffer);
    cdv.setUint32(0, 0x02014b50, true); cdv.setUint16(4, 20, true); cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true); cdv.setUint16(10, 0, true); cdv.setUint16(12, 0, true); cdv.setUint16(14, 0, true);
    cdv.setUint32(16, crc, true); cdv.setUint32(20, data.length, true); cdv.setUint32(24, data.length, true);
    cdv.setUint16(28, nameBytes.length, true); cdv.setUint16(30, 0, true); cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true); cdv.setUint16(36, 0, true); cdv.setUint32(38, 0, true); cdv.setUint32(42, offset, true);
    centralHeader.set(nameBytes, 46);
    centralParts.push(centralHeader);
    offset += localHeader.length + data.length;
  });

  const centralOffset = offset;
  let centralSize = 0;
  centralParts.forEach(p => centralSize += p.length);

  const eocd = new Uint8Array(22);
  const edv = new DataView(eocd.buffer);
  edv.setUint32(0, 0x06054b50, true); edv.setUint16(4, 0, true); edv.setUint16(6, 0, true);
  edv.setUint16(8, files.length, true); edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true); edv.setUint32(16, centralOffset, true); edv.setUint16(20, 0, true);

  const allParts = [...localParts, ...centralParts, eocd];
  let totalLen = 0;
  allParts.forEach(p => totalLen += p.length);
  const result = new Uint8Array(totalLen);
  let pos = 0;
  allParts.forEach(p => { result.set(p, pos); pos += p.length; });
  return result;
}

function escapeXml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}

function sheetXml(rows, colWidths) {
  let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  xml += '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  if (colWidths && colWidths.length) {
    xml += '<cols>' + colWidths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('') + '</cols>';
  }
  xml += '<sheetData>';
  rows.forEach((row, i) => {
    const r = i + 1;
    xml += `<row r="${r}">`;
    row.forEach((val, ci) => {
      const colLetter = String.fromCharCode(65 + ci);
      const cellRef = colLetter + r;
      if (typeof val === 'number') {
        // 數字不為 0 時套用紅色字體（樣式 1）；0 維持預設黑色
        const styleAttr = val !== 0 ? ' s="1"' : '';
        xml += `<c r="${cellRef}"${styleAttr}><v>${val}</v></c>`;
      } else {
        xml += `<c r="${cellRef}" t="inlineStr"><is><t xml:space="preserve">${escapeXml(val)}</t></is></c>`;
      }
    });
    xml += '</row>';
  });
  xml += '</sheetData></worksheet>';
  return xml;
}

// 取得匯出用的「廠內庫存」：以畫面上輸入的「盤點數量」為準；尚未輸入時才沿用原本的 factory_qty
function exportQty(r) {
  let v = r.count_qty;
  if (v === null || v === undefined || String(v).trim() === '') v = r.factory_qty;
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') return v;
  // 全形數字／符號轉半形、去除空白與千分位逗號，能轉成數字就以數字寫入（才能套用紅色字體）
  const t = String(v)
    .replace(/[\uFF01-\uFF5E]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/[\s,]/g, '');
  if (t === '') return '';
  const n = Number(t);
  return Number.isFinite(n) ? n : String(v).trim();
}

function buildInventoryXlsx(dataByGroup) {
  const encoder = new TextEncoder();
  const SHEET_NAME = '庫存盤點';

  const contentTypesXml = [
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">',
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>',
    '<Default Extension="xml" ContentType="application/xml"/>',
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>',
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>',
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>',
    '</Types>'
  ].join('');

  const relsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>';

  const workbookXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    `<sheets><sheet name="${escapeXml(SHEET_NAME)}" sheetId="1" r:id="rId1"/></sheets></workbook>`;

  const workbookRelsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '</Relationships>';

  // 樣式表：xf 0 = 預設；xf 1 = 紅色字體（用於數字不為 0 的儲存格）
  const stylesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<fonts count="2">' +
    '<font><sz val="11"/><name val="Calibri"/></font>' +
    '<font><sz val="11"/><color rgb="FFFF0000"/><name val="Calibri"/></font>' +
    '</fonts>' +
    '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="2">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
    '</cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>';

  // 所有分類（D / E / F …）依序合併到同一張工作表，只保留「貨品名稱」「廠內庫存」兩欄
  const rows = [['貨品名稱', '廠內庫存']];
  Object.keys(dataByGroup).forEach(k => {
    (dataByGroup[k] || []).forEach(r => {
      rows.push([r.name || '', exportQty(r)]);
    });
  });

  const files = [];
  const addFile = (name, xmlStr) => files.push({ nameBytes: encoder.encode(name), data: encoder.encode(xmlStr) });
  addFile('[Content_Types].xml', contentTypesXml);
  addFile('_rels/.rels', relsXml);
  addFile('xl/workbook.xml', workbookXml);
  addFile('xl/_rels/workbook.xml.rels', workbookRelsXml);
  addFile('xl/styles.xml', stylesXml);
  addFile('xl/worksheets/sheet1.xml', sheetXml(rows, [42, 14]));

  return makeZip(files);
}

// ② 盤點匯出 Excel（僅含貨品名稱及廠內庫存，所有分類合併成單一工作表）
document.getElementById('menuExport').addEventListener('click', () => {
  try {
    const bytes = buildInventoryXlsx(DATA);
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const today = new Date();
    const stamp = today.getFullYear() + String(today.getMonth() + 1).padStart(2, '0') + String(today.getDate()).padStart(2, '0');
    const a = document.createElement('a');
    a.href = url;
    a.download = `庫存盤點_廠內庫存_${stamp}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showHomeStatus('已匯出 Excel 檔案');
  } catch (err) {
    console.error(err);
    alert('匯出 Excel 時發生錯誤：' + err.message);
  }
});

// ③ 盤點資料備份（將所有分類、所有品項的完整欄位與資料——編號、名稱、內包裝數量、單位、盤點數量、廠內庫存、備註等——存進瀏覽器）
document.getElementById('menuBackup').addEventListener('click', () => {
  let count = 0;
  Object.keys(DATA).forEach(key => { count += DATA[key].length; });
  // 深複製，避免備份內容之後隨畫面編輯而跟著變動
  const payload = { time: new Date().toISOString(), data: JSON.parse(JSON.stringify(DATA)) };
  try {
    localStorage.setItem(BACKUP_KEY, JSON.stringify(payload));
    const t = new Date(payload.time);
    const timeStr = t.getFullYear() + '/' + String(t.getMonth() + 1).padStart(2, '0') + '/' + String(t.getDate()).padStart(2, '0') + ' ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
    showHomeStatus(`已備份 ${count} 筆品項的完整資料（含編號、名稱、單位、數量等所有欄位，${timeStr}）`);
  } catch (err) {
    console.error(err);
    alert('備份失敗：' + err.message);
  }
});

// ④ 盤點資料恢復（從瀏覽器讀回上次備份，還原所有品項的完整欄位與資料；相容舊版僅含盤點數量的備份格式）
document.getElementById('menuRestore').addEventListener('click', () => {
  let payload;
  try {
    const raw = localStorage.getItem(BACKUP_KEY);
    if (!raw) {
      alert('目前沒有找到任何備份資料。');
      return;
    }
    payload = JSON.parse(raw);
  } catch (err) {
    alert('讀取備份資料失敗。');
    return;
  }
  const t = new Date(payload.time);
  const timeStr = t.getFullYear() + '/' + String(t.getMonth() + 1).padStart(2, '0') + '/' + String(t.getDate()).padStart(2, '0') + ' ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');

  if (payload.data && typeof payload.data === 'object') {
    // 新版格式：完整品項資料（編號／名稱／單位／數量等所有欄位）
    const ok = confirm(`是否要以 ${timeStr} 的備份，還原所有品項的完整資料？\n\n這會用備份內容覆蓋目前每個分類的品項清單（包含名稱、編號、單位、盤點數量等所有欄位）。`);
    if (!ok) return;

    let restoredItems = 0;
    Object.keys(payload.data).forEach(key => {
      if (Array.isArray(payload.data[key])) {
        DATA[key] = payload.data[key];
        restoredItems += DATA[key].length;
      }
    });
    currentSubGroup = null; // 品項可能已變動，重設子分頁選取狀態避免對應不到
    showHomeStatus(`已還原 ${restoredItems} 筆品項的完整資料（來源：${timeStr}）`);
  } else if (payload.values) {
    // 相容舊版備份（僅含盤點數量，沒有完整欄位）
    const ok = confirm(`是否要以 ${timeStr} 的備份（舊版格式，僅含盤點數量）覆蓋目前的盤點數量？`);
    if (!ok) return;

    let restored = 0;
    Object.keys(DATA).forEach(key => {
      DATA[key].forEach(row => {
        if (row.code && Object.prototype.hasOwnProperty.call(payload.values, row.code)) {
          row.count_qty = payload.values[row.code];
          restored++;
        }
      });
    });
    showHomeStatus(`已恢復 ${restored} 筆盤點數量（來源：${timeStr}，舊版備份僅含數量）`);
  } else {
    alert('備份資料格式無法辨識，還原失敗。');
    return;
  }

  if (countScreen.style.display !== 'none') {
    renderTabs();
    renderSubTabs();
    renderTable();
  }
});

// ⑤ 清除盤點數值：預設為 0 的品項維持（回到）0，其餘預設空白的品項全部清為空白
const normCount = v => (v === null || v === undefined) ? '' : String(v).trim();
const defaultCount = row => ('_defCount' in row) ? row._defCount : '';   // 使用者新增的列，預設為空白
document.getElementById('menuClear').addEventListener('click', () => {
  const dirty = [];
  Object.keys(DATA).forEach(key => {
    DATA[key].forEach(row => {
      if (normCount(row.count_qty) !== normCount(defaultCount(row))) dirty.push(row);
    });
  });
  if (dirty.length === 0) {
    showHomeStatus('目前沒有需要清除的盤點數值');
    return;
  }
  const ok = confirm(`確定要清除 ${dirty.length} 筆盤點數值嗎？\n\n預設為 0 的品項會維持 0，其餘全部清為空白。\n（如需保留目前進度，請先按「盤點數值備份」）`);
  if (!ok) return;
  dirty.forEach(row => { row.count_qty = defaultCount(row); });
  showHomeStatus(`已清除 ${dirty.length} 筆盤點數值`);
  if (countScreen.style.display !== 'none') {
    renderTable();
  }
});

// 依據「單位(基)」欄位算出盤點提示：若含有 "/"，取最後一個 "/" 後面的文字；否則取整個單位文字
function getCountHint(unit) {
  if (!unit) return "";
  const s = String(unit).trim();
  if (s === "") return "";
  let effective = s;
  if (s.includes('/')) {
    const parts = s.split('/');
    effective = parts[parts.length - 1].trim();
  }
  if (effective === "") return "";
  return "以" + effective + "盤點";
}

function renderTabs() {
  tabsEl.innerHTML = "";
  Object.keys(DATA).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (key === currentGroup ? ' active' : '');
    const label = GROUP_LABELS[key] || (key + " 類");
    btn.innerHTML = label;
    btn.title = key + ' 類';
    btn.addEventListener('click', () => {
      currentGroup = key;
      currentSubGroup = null; // 換主分頁時重設，renderSubTabs 會自動選第一個子分頁
      renderTabs();
      renderSubTabs();
      renderTable();
      hideHint();
      focusFirstTarget();
    });
    tabsEl.appendChild(btn);
  });
}

// 子分頁（目前僅 D 類，依貨品編號第二碼再分頁）
function renderSubTabs() {
  subtabsEl.innerHTML = "";
  if (!SUBGROUP_GROUPS.includes(currentGroup)) {
    subtabsEl.style.display = 'none';
    currentSubGroup = null;
    return;
  }
  subtabsEl.style.display = 'flex';
  const groups = getSubgroupsFor(currentGroup);
  const keys = Object.keys(groups).sort();
  if (!currentSubGroup || !groups[currentSubGroup]) currentSubGroup = keys[0];

  keys.forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'subtab-btn' + (k === currentSubGroup ? ' active' : '');
    btn.innerHTML = getSubgroupLabel(currentGroup, k) + '<span class="count-badge">' + groups[k].length + '</span>';
    btn.title = k + ' 群';
    btn.addEventListener('click', () => {
      currentSubGroup = k;
      renderSubTabs();
      renderTable();
      hideHint();
      focusFirstTarget();
    });
    subtabsEl.appendChild(btn);
  });
}

function showStatus(text) {
  statusMsg.textContent = text;
  setTimeout(() => { if (statusMsg.textContent === text) statusMsg.textContent = ""; }, 1500);
}

// ---- 依序盤點：自動跳到「盤點數量為空白（沒有數值）」的品項 ----
const isBlankRow = tr => tr.children.length > 1 && tr.children[1].hasAttribute('contenteditable') && tr.children[1].textContent.trim() === '';

// 把游標放進某一列的盤點數量格（已有內容時全選，直接輸入即可取代）
function focusCountCell(tr) {
  const cell = tr.children[1];
  cell.focus({ preventScroll: true });
  const range = document.createRange();
  range.selectNodeContents(cell);
  if (!cell.textContent) range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  tr.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

// 目前分頁中第一個盤點數量為空白的品項（進入盤點程序、切換分頁時使用）
function focusFirstTarget() {
  const target = Array.from(tbodyEl.querySelectorAll('tr')).find(isBlankRow);
  if (target) focusCountCell(target);
  else showStatus('本分頁沒有空白的盤點數量');
}

// 輸入完成（按 Enter / 鍵盤的「下一項」）→ 跳到同分頁「下一個」盤點數量為空白的品項
let lastAdvanceAt = 0, lastAdvanceFrom = null;
function goNextTarget(fromTr) {
  const now = Date.now();
  // 同一列在極短時間內收到兩種鍵盤事件（keydown + beforeinput）時只算一次；換到下一列後的 Enter 不受影響
  if (fromTr === lastAdvanceFrom && now - lastAdvanceAt < 80) return;
  lastAdvanceAt = now;
  lastAdvanceFrom = fromTr;
  let next = fromTr.nextElementSibling;
  while (next && !isBlankRow(next)) next = next.nextElementSibling;
  if (next) {
    focusCountCell(next);
  } else {
    if (document.activeElement) document.activeElement.blur();
    closeRowHint();
    const left = Array.from(tbodyEl.querySelectorAll('tr')).filter(isBlankRow).length;
    showStatus(left ? `已到本分頁最後，尚有 ${left} 項空白` : '本分頁已盤點完畢');
  }
}

// 目前展開盤點單位提示的那一列（同時間只會有一列展開）
let activeHintRow = null;

function closeRowHint() {
  if (activeHintRow) activeHintRow.classList.remove('hint-open');   // 提示向右滑回 ⓘ 後方
  activeHintRow = null;
}
// 舊名稱保留：返回主畫面、重新繪製表格時呼叫
function hideHint() { closeRowHint(); }

function openRowHint(tr) {
  if (activeHintRow === tr) return;
  closeRowHint();                                                    // 前一列先收回
  tr.classList.add('hint-open');                                     // 提示向左滑出展開
  activeHintRow = tr;
}

function makeCell(value, editable, className) {
  const td = document.createElement('td');
  if (className) td.className = className;
  td.textContent = (value === null || value === undefined) ? "" : value;
  if (editable) td.setAttribute('contenteditable', 'true');
  return td;
}

// 目前分頁／子分頁／搜尋條件下，實際顯示中的品項列表
function getVisibleRows() {
  let rows = DATA[currentGroup] || [];
  if (SUBGROUP_GROUPS.includes(currentGroup)) {
    rows = rows.filter(r => getSubgroupKey(r.code) === currentSubGroup);
  }
  const term = searchTerm.trim().toLowerCase();
  if (term) {
    rows = rows.filter(row => ((row.name || "") + " " + (row.code || "")).toLowerCase().includes(term));
  }
  return rows;
}

function renderTable() {
  hideHint();
  tbodyEl.innerHTML = "";
  const rows = getVisibleRows();

  rows.forEach((row) => {
    const tr = document.createElement('tr');

    // 貨品名稱欄（含盤點單位提示圖示）
    const tdName = document.createElement('td');
    const wrap = document.createElement('div');
    wrap.className = 'name-cell';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'name-text';
    nameSpan.setAttribute('contenteditable', 'true');
    nameSpan.textContent = row.name || "";
    nameSpan.addEventListener('input', () => { row.name = nameSpan.textContent; });

    const hintIcon = document.createElement('span');
    hintIcon.className = 'hint-icon';
    hintIcon.textContent = 'i';
    hintIcon.title = '查看盤點單位提示';
    // 提示膠囊：藏在 ⓘ 左側，展開時向左滑出
    const hintBox = document.createElement('span');
    hintBox.className = 'hint-box';
    const hintSlot = document.createElement('span');
    hintSlot.className = 'hint-slot';
    const hintChip = document.createElement('span');
    hintChip.className = 'hint-chip';
    hintChip.textContent = getCountHint(row.unit) || '無盤點單位資訊';   // 文字先填好，展開時寬度不會跳動
    hintSlot.appendChild(hintChip);

    // ⓘ 圖示仍可手動展開／收回
    hintIcon.addEventListener('click', (e) => {
      e.stopPropagation();
      if (activeHintRow === tr) closeRowHint();
      else openRowHint(tr);
    });

    hintBox.appendChild(hintSlot);
    hintBox.appendChild(hintIcon);
    wrap.appendChild(nameSpan);
    wrap.appendChild(hintBox);
    tdName.appendChild(wrap);

    // 盤點數量欄
    const tdCount = makeCell(row.count_qty, true);
    tdCount.addEventListener('input', () => { row.count_qty = tdCount.textContent; });
    tdCount.setAttribute('enterkeyhint', 'next');
    tdCount.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        goNextTarget(tr);
      }
    });
    // 部分手機鍵盤（如 Android）不送 keydown，只送 beforeinput
    tdCount.addEventListener('beforeinput', (e) => {
      if (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak') {
        e.preventDefault();
        goNextTarget(tr);
      }
    });

    tr.appendChild(tdName);
    tr.appendChild(tdCount);

    const tdDel = document.createElement('td');
    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.textContent = '✕';
    delBtn.title = '刪除此列';
    delBtn.addEventListener('click', () => {
      const realIdx = DATA[currentGroup].indexOf(row);
      if (realIdx > -1) DATA[currentGroup].splice(realIdx, 1);
      renderTabs();
      renderSubTabs();
      renderTable();
      showStatus('已刪除一列');
    });
    tdDel.appendChild(delBtn);
    tr.appendChild(tdDel);

    // 點選（或以鍵盤切換到）任一品項列，自動顯示該品項的盤點單位提示
    const autoShowHint = (e) => {
      if (e.target.closest('.del-btn')) return;
      if (getCountHint(row.unit)) openRowHint(tr);   // 沒有單位資訊的列不自動展開
    };
    tr.addEventListener('click', autoShowHint);
    tr.addEventListener('focusin', autoShowHint);

    tbodyEl.appendChild(tr);
  });

  if (rows.length === 0 || tbodyEl.children.length === 0) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 3;
    td.style.textAlign = 'center';
    td.style.color = 'var(--text-muted)';
    td.style.padding = '24px';
    td.textContent = '沒有符合的資料';
    tr.appendChild(td);
    tbodyEl.appendChild(tr);
  }
}

// 點到目前展開那一列以外的任何地方，或鍵盤焦點離開該列 → 提示向右收回
document.addEventListener('pointerdown', (e) => {
  if (activeHintRow && !activeHintRow.contains(e.target)) closeRowHint();
});
document.addEventListener('focusin', (e) => {
  if (activeHintRow && !activeHintRow.contains(e.target)) closeRowHint();
});

// ⑥ 新增品項（從主畫面開啟，可指定類別／子分頁／插入位置，並輸入貨品編號、名稱、內包裝數量、單位(基)）
function getRowsForGroupSub(groupKey, subKey) {
  let rows = DATA[groupKey] || [];
  if (SUBGROUP_GROUPS.includes(groupKey)) {
    rows = rows.filter(r => getSubgroupKey(r.code) === subKey);
  }
  return rows;
}

let addItemPositionRefs = [];

function updateAddItemSubGroupOptions() {
  const group = document.getElementById('addItemGroup').value;
  const wrap = document.getElementById('addItemSubGroupWrap');
  const subSelect = document.getElementById('addItemSubGroup');
  subSelect.innerHTML = '';
  if (!SUBGROUP_GROUPS.includes(group)) {
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'block';
  const groups = getSubgroupsFor(group);
  const keys = Object.keys(groups).sort();
  keys.forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = getSubgroupLabel(group, k) + '（' + groups[k].length + ' 項）';
    subSelect.appendChild(opt);
  });
  if (keys.length) subSelect.value = keys[0];
}

function updateAddItemPositionOptions() {
  const group = document.getElementById('addItemGroup').value;
  const sub = SUBGROUP_GROUPS.includes(group) ? document.getElementById('addItemSubGroup').value : null;
  const rows = getRowsForGroupSub(group, sub);
  addItemPositionRefs = rows;

  const posSelect = document.getElementById('addItemPosition');
  posSelect.innerHTML = '';
  const optEnd = document.createElement('option');
  optEnd.value = 'END';
  optEnd.textContent = '新增在最後';
  posSelect.appendChild(optEnd);
  rows.forEach((r, idx) => {
    const opt = document.createElement('option');
    opt.value = String(idx);
    opt.textContent = (r.code ? r.code + ' - ' : '') + (r.name || '(未命名)');
    posSelect.appendChild(opt);
  });
  posSelect.value = 'END';
}

function openAddItemModal() {
  const groupSelect = document.getElementById('addItemGroup');
  groupSelect.innerHTML = '';
  Object.keys(DATA).forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = GROUP_LABELS[k] || (k + ' 類');
    groupSelect.appendChild(opt);
  });
  groupSelect.value = Object.keys(DATA)[0];

  document.getElementById('addItemCode').value = '';
  document.getElementById('addItemName').value = '';
  document.getElementById('addItemInnerQty').value = '';
  document.getElementById('addItemUnit').value = '';

  updateAddItemSubGroupOptions();
  updateAddItemPositionOptions();

  document.getElementById('addItemModal').style.display = 'flex';
  document.getElementById('addItemName').focus();
}

function closeAddItemModal() {
  document.getElementById('addItemModal').style.display = 'none';
}

document.getElementById('menuAddItem').addEventListener('click', openAddItemModal);
document.getElementById('addItemCancelBtn').addEventListener('click', closeAddItemModal);
document.getElementById('addItemModal').addEventListener('click', (e) => {
  if (e.target.id === 'addItemModal') closeAddItemModal();
});
document.getElementById('addItemGroup').addEventListener('change', () => {
  updateAddItemSubGroupOptions();
  updateAddItemPositionOptions();
});
document.getElementById('addItemSubGroup').addEventListener('change', updateAddItemPositionOptions);

['addItemCode', 'addItemName', 'addItemInnerQty', 'addItemUnit'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('addItemConfirmBtn').click();
    }
  });
});

document.getElementById('addItemConfirmBtn').addEventListener('click', () => {
  const name = document.getElementById('addItemName').value.trim();
  if (!name) {
    alert('請輸入貨品名稱');
    document.getElementById('addItemName').focus();
    return;
  }
  const code = document.getElementById('addItemCode').value.trim();
  const innerQty = document.getElementById('addItemInnerQty').value.trim();
  const unit = document.getElementById('addItemUnit').value.trim();
  const group = document.getElementById('addItemGroup').value;

  const newRow = { code, name, inner_qty: innerQty, unit, count_qty: '', factory_qty: '', remark: null, _defCount: '' };

  const posValue = document.getElementById('addItemPosition').value;
  const arr = DATA[group];
  if (posValue === 'END') {
    arr.push(newRow);
  } else {
    const refRow = addItemPositionRefs[Number(posValue)];
    let insertAt = arr.length;
    if (refRow) {
      const idx = arr.indexOf(refRow);
      insertAt = (idx > -1) ? idx + 1 : arr.length;
    }
    arr.splice(insertAt, 0, newRow);
  }

  closeAddItemModal();
  showHomeStatus(`已新增品項「${name}」至 ${GROUP_LABELS[group] || group}`);

  // 若目前正停留在盤點畫面，順便刷新分頁與列表
  if (countScreen.style.display !== 'none') {
    renderTabs();
    renderSubTabs();
    renderTable();
  }
});

searchBox.addEventListener('input', (e) => {
  searchTerm = e.target.value;
  renderTable();
});

renderTabs();
renderSubTabs();
renderTable();
</script>
